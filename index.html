<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intickets-watcher — архив найденных сеансов</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #f5f6f8; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e6e6e6; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #777; font-size: 13px; margin-bottom: 16px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
  label.toggle { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .count { font-size: 13px; color: #777; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; font-size: 13px; }
  @media (prefers-color-scheme: dark) { table { background: #1e2126; } input[type=search] { background: #1e2126; color: #e6e6e6; border-color: #444; } }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(127,127,127,0.15); }
  th { position: sticky; top: 0; background: inherit; font-weight: 600; }
  tr.tracked { background: rgba(255, 205, 0, 0.08); }
  .badge { display: inline-block; font-size: 11px; background: #ffcd00; color: #1a1a1a; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .nowrap { white-space: nowrap; }
  tr[hidden] { display: none; }
  a { color: #1B65F5; }
</style>
</head>
<body>
  <h1>intickets-watcher — архив найденных сеансов</h1>
  <div class="sub">Обновлено: 2026-07-24T16:09:11.136Z · всего в архиве: 0 · из них отслеживаемых: 0 · архив хранится 7 дн. (кроме отслеживаемых — храним всегда)</div>
  <div class="controls">
    <input type="search" id="search" placeholder="Поиск по названию, организатору, ID...">
    <label class="toggle"><input type="checkbox" id="onlyTracked"> только отслеживаемые ★</label>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Найдено</th>
        <th>Дата события</th>
        <th>Название</th>
        <th>Продажи</th>
        <th>cabinetUid</th>
        <th>eventId</th>
        <th>seanceId</th>
      </tr>
    </thead>
    <tbody id="rows">

    </tbody>
  </table>
  <script>
    const search = document.getElementById('search');
    const onlyTracked = document.getElementById('onlyTracked');
    const rows = Array.from(document.querySelectorAll('#rows tr'));
    const count = document.getElementById('count');
    function apply() {
      const q = search.value.trim().toLowerCase();
      const trackedOnly = onlyTracked.checked;
      let shown = 0;
      for (const row of rows) {
        const matchesQuery = !q || row.dataset.search.includes(q);
        const matchesTracked = !trackedOnly || row.classList.contains('tracked');
        const visible = matchesQuery && matchesTracked;
        row.hidden = !visible;
        if (visible) shown++;
      }
      count.textContent = shown + ' из ' + rows.length;
    }
    search.addEventListener('input', apply);
    onlyTracked.addEventListener('change', apply);
    apply();
  </script>
</body>
</html>
